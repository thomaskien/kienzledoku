# Nur technische Einstellungen; keine API-Keys, OAuth- oder Patientendaten.
[connection]
mode = "connect"
target = "https://127.0.0.1:16567/aps/fhir/api/r4"
ca_file = ""
allow_insecure_tls = false

[commander]
enabled = true
# Record verwendet immer Commander. Bei gemeinsam installiertem Server setzt
# der Installer stattdessen http://127.0.0.1:8185.
url = "http://10.0.83.140:8185"
token_env = "KIENZLEDOKU_COMMANDER_TOKEN"
# Token sind optional; leer verwendet einen gegebenenfalls privat gespeicherten Zugang.
token_file = ""
request_timeout = 14400
default_quality = "auto"

# Kompatibilitätsfelder für alte Konfigurationen; Record verwendet sie nicht.
[services]
asr = "http://127.0.0.1:8179"
diarization = "http://127.0.0.1:8183"
llm = "http://127.0.0.1:8080"

[record]
diarization = true
microphone = ""
output_mode = "structured"
single_code = "KI"
# Lokal für diesen Client; während der Aufnahme verstellbar.
vad_enabled = true
silence_threshold_dbfs = -50
